<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Pro - Online Multiplayer</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --wood-dark: #3d2817;
            --wood-light: #8b5a2b;
            --wood-mid: #5c3a1e;
            --premium-red: #e74c3c;
            --premium-pink: #ff69b4;
            --premium-blue: #3498db;
            --premium-light-blue: #87ceeb;
            --tile-beige: #f5e6d3;
            --gold: #ffd700;
            --shadow: rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }

        .floating-tile {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--tile-beige);
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: float 20s infinite ease-in-out;
            opacity: 0.6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #3d2817;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }

        .game-header {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 3em;
            background: linear-gradient(45deg, var(--gold), #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,215,0,0.5);
            letter-spacing: 4px;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .connection-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
            font-weight: 600;
        }

        .connection-status.online {
            background: #2ecc71;
            color: #000;
            box-shadow: 0 0 10px #2ecc71;
        }

        .connection-status.offline {
            background: #e74c3c;
            color: #fff;
        }

        .connection-status.connecting {
            background: #f39c12;
            color: #000;
            animation: pulse 1.5s infinite;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .board-section {
            perspective: 1200px;
            flex: 1;
            min-width: 600px;
            max-width: 700px;
        }

        .board-container {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(20deg);
            transition: transform 0.5s ease;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border-radius: 12px;
        }

        .board-container:hover {
            transform: rotateX(15deg) rotateY(5deg);
        }

        .board-frame {
            background: linear-gradient(145deg, var(--wood-dark), var(--wood-mid), var(--wood-light));
            padding: 20px;
            border-radius: 15px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.5),
                0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .board-frame::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            pointer-events: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 2px;
            background: #2c1810;
            padding: 4px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .cell {
            aspect-ratio: 1;
            background: #d4a574;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border-radius: 3px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .cell:hover {
            transform: translateZ(10px) scale(1.1);
            z-index: 10;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .cell.triple-word {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        .cell.double-word {
            background: linear-gradient(135deg, #ff69b4, #e91e63);
            color: white;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        .cell.triple-letter {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        .cell.double-letter {
            background: linear-gradient(135deg, #87ceeb, #5dade2);
            color: #1a5276;
            box-shadow: 0 0 10px rgba(135, 206, 235, 0.5);
        }

        .cell.center {
            background: radial-gradient(circle, #f39c12, #e67e22);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.8);
        }

        .cell.star::after {
            content: '★';
            font-size: 1.5em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .tile {
            width: 90%;
            height: 90%;
            background: linear-gradient(145deg, #f5e6d3, #e6d5b8);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.1),
                inset 0 2px 0 rgba(255,255,255,0.5);
            cursor: grab;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.2s ease;
            font-family: 'Cinzel', serif;
            user-select: none;
        }

        .tile:hover {
            transform: translateZ(20px) scale(1.1) rotateX(-10deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .tile.dragging {
            cursor: grabbing;
            transform: scale(1.2) rotateZ(5deg);
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            opacity: 0.8;
        }

        .tile.placed {
            animation: placeTile 0.4s ease;
        }

        .tile.placed-by-opponent {
            background: linear-gradient(145deg, #e8d5c4, #d4c4a8);
            border: 2px solid #e74c3c;
            animation: opponentPlace 0.6s ease;
        }

        @keyframes placeTile {
            0% { transform: scale(1.5) rotateZ(10deg); opacity: 0; }
            50% { transform: scale(0.9) rotateZ(-5deg); }
            100% { transform: scale(1) rotateZ(0deg); opacity: 1; }
        }

        @keyframes opponentPlace {
            0% { transform: scale(0) rotateZ(-180deg); opacity: 0; }
            60% { transform: scale(1.1) rotateZ(10deg); }
            100% { transform: scale(1) rotateZ(0deg); opacity: 1; }
        }

        .tile-letter {
            font-size: 1.4em;
            font-weight: bold;
            color: #2c1810;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        .tile-score {
            font-size: 0.5em;
            color: #666;
            position: absolute;
            bottom: 2px;
            right: 3px;
        }

        .side-panel {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .room-info {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.3);
            text-align: center;
        }

        .room-code {
            font-family: monospace;
            font-size: 1.5em;
            color: var(--gold);
            letter-spacing: 3px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-code:hover {
            text-shadow: 0 0 10px var(--gold);
            transform: scale(1.05);
        }

        .player-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .player-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
            background: rgba(255,215,0,0.1);
        }

        .player-card.waiting {
            opacity: 0.5;
            border-style: dashed;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-family: 'Cinzel', serif;
            font-size: 1.3em;
            color: var(--gold);
        }

        .player-status {
            font-size: 0.7em;
            padding: 3px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }

        .player-status.connected {
            background: #2ecc71;
            color: #000;
        }

        .player-score {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .rack-container {
            background: linear-gradient(145deg, var(--wood-dark), var(--wood-mid));
            padding: 25px 20px 15px;
            border-radius: 10px 10px 20px 20px;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 5px 10px rgba(0,0,0,0.3);
            position: relative;
            margin-top: 20px;
            transition: opacity 0.3s;
        }

        .rack-container.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.8);
        }

        .rack-container::before {
            content: 'YOUR TILES';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: #000;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .rack {
            display: flex;
            justify-content: center;
            gap: 8px;
            min-height: 60px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 2px dashed rgba(255,255,255,0.1);
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        .game-log {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9em;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-entry.success { color: #2ecc71; }
        .log-entry.error { color: #e74c3c; }
        .log-entry.info { color: #3498db; }
        .log-entry.opponent { color: #f39c12; }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            animation: particleBurst 1s ease-out forwards;
        }

        @keyframes particleBurst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .word-valid {
            animation: wordValid 0.6s ease;
        }

        @keyframes wordValid {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); filter: brightness(1.5); }
            100% { transform: scale(1); }
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            font-size: 1.2em;
        }

        .sound-toggle:hover {
            transform: scale(1.1);
            background: var(--gold);
            color: #000;
        }

        .sound-toggle.muted {
            opacity: 0.5;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.3s;
        }

        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 50px rgba(255,215,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: modalAppear 0.5s ease;
        }

        @keyframes modalAppear {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 2em;
        }

        .modal input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid rgba(255,215,0,0.3);
            background: rgba(0,0,0,0.3);
            color: #fff;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
            transition: all 0.3s;
        }

        .modal input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }

        .modal input::placeholder {
            color: #666;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-large {
            padding: 15px 30px;
            font-size: 1em;
        }

        .turn-indicator {
            text-align: center;
            padding: 15px;
            background: rgba(255,215,0,0.1);
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,215,0,0.3);
            font-weight: 600;
            transition: all 0.3s;
        }

        .turn-indicator.your-turn {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
            animation: pulse 2s infinite;
        }

        .turn-indicator.waiting {
            color: #f39c12;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: opacity 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,215,0,0.3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: var(--gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        @media (max-width: 1024px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            .board-section {
                min-width: auto;
                width: 100%;
                max-width: 600px;
            }
            
            .side-panel {
                flex: 1;
                width: 100%;
                max-width: 600px;
            }
            
            .game-title {
                font-size: 2em;
            }
            
            .board-container {
                transform: rotateX(10deg);
            }
        }

        @media (max-width: 600px) {
            .board-section {
                min-width: auto;
            }
            
            .cell {
                font-size: 0.5em;
            }
            
            .tile-letter {
                font-size: 1em;
            }
        }

        /* Shake animation for invalid moves */
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid var(--gold);
            z-index: 10002;
            opacity: 0;
            transition: all 0.3s;
            font-weight: 600;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: #2ecc71; color: #2ecc71; }
        .toast.error { border-color: #e74c3c; color: #e74c3c; }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">INITIALIZING...</div>
    </div>

    <!-- Connection Modal -->
    <div class="modal-overlay" id="connectionModal">
        <div class="modal">
            <h2>🏠 Join or Create Game</h2>
            
            <!-- Name Input - NEW -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; color: #aaa; margin-bottom: 5px; font-size: 0.9em;">Your Name</label>
                <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="15" value="Player">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; color: #aaa; margin-bottom: 5px; font-size: 0.9em;">Room Code (for joining)</label>
                <input type="text" id="roomInput" placeholder="ROOM CODE (e.g., ABC123)" maxlength="6">
            </div>
            
            <div class="modal-buttons">
                <button class="btn btn-primary btn-large" onclick="game.createRoom()">Create New Game</button>
                <button class="btn btn-secondary btn-large" onclick="game.joinRoom()">Join Game</button>
            </div>
            <p style="margin-top: 20px; font-size: 0.8em; color: #666;">
                Create a room and share the code with a friend!
            </p>
        </div>
    </div>

    <!-- Sound Toggle -->
    <button class="sound-toggle" id="soundToggle" title="Toggle Sound">🔊</button>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Background Animation -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Particles Container -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="game-header">
        <h1 class="game-title">SCRABBLE PRO</h1>
        <div class="connection-status connecting" id="connectionStatus">Initializing...</div>
    </header>

    <!-- Main Game Container -->
    <div class="game-container" id="gameContainer" style="display: none;">
        <!-- Board Section -->
        <div class="board-section">
            <div class="board-container" id="boardContainer">
                <div class="board-frame">
                    <div class="board" id="board"></div>
                </div>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            <!-- Room Info -->
            <div class="room-info">
                <div style="font-size: 0.8em; color: #aaa; margin-bottom: 5px;">ROOM CODE (Click to Copy)</div>
                <div class="room-code" id="roomCodeDisplay" onclick="game.copyRoomCode()">----</div>
                <div style="font-size: 0.7em; color: #666; margin-top: 5px;">Share this code to invite players</div>
            </div>

            <!-- Turn Indicator -->
            <div class="turn-indicator" id="turnIndicator">
                Waiting for players...
            </div>

            <!-- Player 1 -->
            <div class="player-card waiting" id="player1Card">
                <div class="player-header">
                    <span class="player-name" id="player1NameDisplay">Player 1</span>
                    <span class="player-status" id="player1Status">Waiting...</span>
                </div>
                <div class="player-score" id="score1">0</div>
            </div>

            <!-- Player 2 -->
            <div class="player-card waiting" id="player2Card">
                <div class="player-header">
                    <span class="player-name" id="player2NameDisplay">Player 2</span>
                    <span class="player-status" id="player2Status">Waiting...</span>
                </div>
                <div class="player-score" id="score2">0</div>
            </div>

            <!-- Current Player Rack -->
            <div class="rack-container disabled" id="rackContainer">
                <div class="rack" id="rack"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-primary" id="playBtn" onclick="game.playWord()" disabled>Play Word</button>
                <button class="btn btn-secondary" id="shuffleBtn" onclick="game.shuffleRack()" disabled>Shuffle</button>
                <button class="btn btn-secondary" id="recallBtn" onclick="game.recallTiles()" disabled>Recall</button>
                <button class="btn btn-danger" id="skipBtn" onclick="game.skipTurn()" disabled>Skip Turn</button>
            </div>

            <!-- Game Log -->
            <div class="game-log" id="gameLog">
                <div class="log-entry info">Welcome! Create or join a room to start playing.</div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // AUDIO SYSTEM - Web Audio API
        // ==========================================
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.initialized = false;
                this.volume = 0.3;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                    console.log('Audio initialized');
                } catch (e) {
                    console.error('Audio init failed:', e);
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled && !this.initialized) {
                    this.init();
                }
                return this.enabled;
            }

            playTone(freq, type, duration, vol = null) {
                if (!this.enabled || !this.ctx) return;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                const volume = (vol || this.volume) * 0.3;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playTilePlace() {
                this.playTone(200, 'sine', 0.1, 0.5);
                setTimeout(() => this.playTone(150, 'sine', 0.08, 0.4), 50);
            }

            playTilePickup() {
                this.playTone(300, 'sine', 0.05, 0.3);
            }

            playWordValid() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.3, 0.4), i * 80);
                });
            }

            playWordInvalid() {
                this.playTone(150, 'sawtooth', 0.3, 0.5);
                setTimeout(() => this.playTone(100, 'sawtooth', 0.3, 0.5), 150);
            }

            playTurnChange() {
                this.playTone(440, 'sine', 0.1, 0.3);
                setTimeout(() => this.playTone(554, 'sine', 0.1, 0.3), 100);
                setTimeout(() => this.playTone(659, 'sine', 0.2, 0.3), 200);
            }

            playPlayerJoined() {
                this.playTone(523, 'sine', 0.2, 0.4);
                setTimeout(() => this.playTone(659, 'sine', 0.2, 0.4), 150);
                setTimeout(() => this.playTone(783, 'sine', 0.4, 0.4), 300);
            }

            playShuffle() {
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        const freq = 200 + Math.random() * 300;
                        this.playTone(freq, 'sine', 0.05, 0.2);
                    }, i * 60);
                }
            }

            playGameStart() {
                [523, 659, 783, 1046, 1318].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.4, 0.4), i * 120);
                });
            }
        }

        // ==========================================
        // VISUAL EFFECTS SYSTEM
        // ==========================================
        class VisualEffects {
            constructor() {
                this.container = document.createElement('div');
                this.container.className = 'particles';
                document.body.appendChild(this.container);
            }

            createParticle(x, y, color = '#ffd700') {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = color;
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                this.container.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }

            burst(x, y, count = 12, color) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => this.createParticle(x, y, color), i * 25);
                }
            }

            celebrateWord(cells) {
                cells.forEach((cell, i) => {
                    setTimeout(() => {
                        const rect = cell.getBoundingClientRect();
                        const x = rect.left + rect.width / 2;
                        const y = rect.top + rect.height / 2;
                        this.burst(x, y, 8, '#2ecc71');
                        cell.classList.add('word-valid');
                        setTimeout(() => cell.classList.remove('word-valid'), 600);
                    }, i * 80);
                });
            }

            celebrateVictory() {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const x = window.innerWidth / 2 + (Math.random() - 0.5) * 400;
                        const y = window.innerHeight / 2 + (Math.random() - 0.5) * 400;
                        this.burst(x, y, 20, '#ffd700');
                    }, i * 200);
                }
            }

            shake(element) {
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 500);
            }
        }

        // ==========================================
        // ONLINE SCRABBLE GAME
        // ==========================================
        class OnlineScrabble {
            constructor() {
                this.audio = new AudioSystem();
                this.vfx = new VisualEffects();
                
                // REPLACE WITH YOUR FIREBASE CONFIG
                this.firebaseConfig = {
    apiKey: "YOUR_REAL_API_KEY",
    authDomain: "scrabble-ry-2024.firebaseapp.com",
    databaseURL: "https://scrabble-ry-2024-default-rtdb.firebaseio.com",
    projectId: "scrabble-ry-2024",
    storageBucket: "scrabble-ry-2024.appspot.com",
    messagingSenderId: "YOUR_REAL_SENDER_ID",
    appId: "YOUR_REAL_APP_ID"
};    
                
                this.db = null;
                this.roomId = null;
                this.playerId = null;
                this.playerNumber = null;
                this.playerName = "Player";
                this.gameState = null;
                this.board = [];
                this.rack = [];
                this.placedTiles = [];
                this.selectedTile = null;
                this.isDragging = false;
                this.dragOffset = { x: 0, y: 0 };
                this.dragElement = null;
                
                this.letterScores = {
                    'A': 1, 'B': 3, 'C': 3, 'D': 2, 'E': 1, 'F': 4, 'G': 2, 'H': 4,
                    'I': 1, 'J': 8, 'K': 5, 'L': 1, 'M': 3, 'N': 1, 'O': 1, 'P': 3,
                    'Q': 10, 'R': 1, 'S': 1, 'T': 1, 'U': 1, 'V': 4, 'W': 4, 'X': 8,
                    'Y': 4, 'Z': 10, ' ': 0
                };
                
                this.init();
            }

            init() {
                document.addEventListener('click', () => {
                    this.audio.init();
                }, { once: true });

                document.getElementById('soundToggle').addEventListener('click', (e) => {
                    const enabled = this.audio.toggle();
                    e.target.textContent = enabled ? '🔊' : '🔇';
                    e.target.classList.toggle('muted', !enabled);
                });

                document.getElementById('roomInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.joinRoom();
                });

                this.createBackgroundAnimation();
                
                setTimeout(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                }, 800);
            }

            initializeFirebase() {
                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(this.firebaseConfig);
                    }
                    this.db = firebase.database();
                    console.log('Firebase initialized');
                    return true;
                } catch (error) {
                    console.error('Firebase init error:', error);
                    this.showToast('Failed to connect to game server', 'error');
                    return false;
                }
            }

            generateRoomCode() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let code = '';
                for (let i = 0; i < 6; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            }

            getPlayerName() {
                const input = document.getElementById('playerNameInput');
                const name = input.value.trim();
                return name || 'Player ' + this.playerNumber;
            }

            createRoom() {
                if (!this.initializeFirebase()) return;
                
                this.playerName = this.getPlayerName();
                this.roomId = this.generateRoomCode();
                this.playerId = this.generatePlayerId();
                this.playerNumber = 1;
                
                document.getElementById('roomCodeDisplay').textContent = this.roomId;
                document.getElementById('player1NameDisplay').textContent = this.playerName;
                this.hideModal();
                document.getElementById('gameContainer').style.display = 'flex';
                
                const initialState = this.createInitialGameState();
                
                this.db.ref('rooms/' + this.roomId).set(initialState)
                    .then(() => {
                        this.setupGameListeners();
                        this.log('Room created! Share code: ' + this.roomId, 'success');
                        this.updateConnectionStatus('online', 'Waiting for opponent...');
                        this.showToast('Room created! Share the code: ' + this.roomId, 'success');
                    })
                    .catch(err => {
                        console.error('Error creating room:', err);
                        this.showToast('Error creating room', 'error');
                    });
            }

            joinRoom() {
                const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
                if (!roomCode || roomCode.length !== 6) {
                    this.showToast('Please enter a valid 6-character room code', 'error');
                    return;
                }
                
                if (!this.initializeFirebase()) return;
                
                this.playerName = this.getPlayerName();
                this.roomId = roomCode;
                this.playerId = this.generatePlayerId();
                this.playerNumber = 2;
                
                document.getElementById('roomCodeDisplay').textContent = this.roomId;
                
                this.db.ref('rooms/' + this.roomId).once('value')
                    .then(snapshot => {
                        if (!snapshot.exists()) {
                            throw new Error('Room not found');
                        }
                        
                        const data = snapshot.val();
                        if (data.players && data.players[2] && data.players[2].connected) {
                            throw new Error('Room is full');
                        }
                        
                        const updates = {
                            'players/2': {
                                connected: true,
                                id: this.playerId,
                                name: this.playerName,
                                rack: this.drawTiles(data.tileBag, 7),
                                joinedAt: Date.now()
                            },
                            'tileBag': data.tileBag.slice(7),
                            'log': [...(data.log || []), { 
                                message: this.playerName + ' joined the game!', 
                                type: 'success', 
                                timestamp: Date.now() 
                            }]
                        };
                        
                        return this.db.ref('rooms/' + this.roomId).update(updates);
                    })
                    .then(() => {
                        this.hideModal();
                        document.getElementById('gameContainer').style.display = 'flex';
                        this.setupGameListeners();
                        this.log('Joined room ' + this.roomId, 'success');
                        this.audio.playPlayerJoined();
                        this.showToast('Joined game successfully!', 'success');
                    })
                    .catch(err => {
                        console.error('Join error:', err);
                        this.showToast(err.message === 'Room not found' ? 'Room not found!' : 
                                      err.message === 'Room is full' ? 'Room is full!' : 
                                      'Error joining room', 'error');
                    });
            }

            generatePlayerId() {
                return 'p_' + Math.random().toString(36).substr(2, 9);
            }

            createInitialGameState() {
                const tileBag = this.createShuffledBag();
                
                return {
                    board: this.createEmptyBoard(),
                    currentPlayer: 1,
                    scores: { 1: 0, 2: 0 },
                    players: {
                        1: {
                            connected: true,
                            id: this.playerId,
                            name: this.playerName,
                            rack: this.drawTiles(tileBag, 7),
                            joinedAt: Date.now()
                        },
                        2: {
                            connected: false,
                            id: null,
                            name: null,
                            rack: [],
                            joinedAt: null
                        }
                    },
                    tileBag: tileBag,
                    log: [{ 
                        message: 'Game started! Waiting for Player 2...', 
                        type: 'info', 
                        timestamp: Date.now() 
                    }],
                    gameStarted: false,
                    gameEnded: false,
                    winner: null,
                    lastMove: null,
                    createdAt: Date.now()
                };
            }

            createEmptyBoard() {
                const board = [];
                for (let i = 0; i < 15; i++) {
                    board[i] = [];
                    for (let j = 0; j < 15; j++) {
                        board[i][j] = null;
                    }
                }
                return board;
            }

            createShuffledBag() {
                const bag = [];
                const distribution = {
                    'A': 9, 'B': 2, 'C': 2, 'D': 4, 'E': 12, 'F': 2, 'G': 3, 'H': 2,
                    'I': 9, 'J': 1, 'K': 1, 'L': 4, 'M': 2, 'N': 6, 'O': 8, 'P': 2,
                    'Q': 1, 'R': 6, 'S': 4, 'T': 6, 'U': 4, 'V': 2, 'W': 2, 'X': 1,
                    'Y': 2, 'Z': 1, ' ': 2
                };
                
                for (let letter in distribution) {
                    for (let i = 0; i < distribution[letter]; i++) {
                        bag.push(letter);
                    }
                }
                
                for (let i = bag.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [bag[i], bag[j]] = [bag[j], bag[i]];
                }
                
                return bag;
            }

            drawTiles(bag, count) {
                const drawn = [];
                for (let i = 0; i < count && bag.length > 0; i++) {
                    drawn.push(bag.pop());
                }
                return drawn;
            }

            setupGameListeners() {
                this.gameRef = this.db.ref('rooms/' + this.roomId);
                this.gameRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data) {
                        this.showToast('Game room was deleted', 'error');
                        location.reload();
                        return;
                    }
                    
                    this.gameState = data;
                    this.updateUI(data);
                });

                this.db.ref('rooms/' + this.roomId + '/players/' + this.playerNumber + '/connected').onDisconnect().set(false);
            }

            updateUI(data) {
                const p1 = data.players[1] || {};
                const p2 = data.players[2] || {};
                
                // Update player names
                document.getElementById('player1NameDisplay').textContent = p1.name || 'Player 1';
                document.getElementById('player2NameDisplay').textContent = p2.name || 'Player 2';
                
                // Player 1 card
                const p1Card = document.getElementById('player1Card');
                const p1Status = document.getElementById('player1Status');
                p1Status.textContent = p1.connected ? 'Connected' : 'Disconnected';
                p1Status.className = 'player-status ' + (p1.connected ? 'connected' : '');
                p1Card.className = 'player-card ' + (p1.connected ? '' : 'waiting') + 
                                   (data.currentPlayer === 1 ? ' active' : '');
                
                // Player 2 card
                const p2Card = document.getElementById('player2Card');
                const p2Status = document.getElementById('player2Status');
                p2Status.textContent = p2.connected ? 'Connected' : 'Waiting...';
                p2Status.className = 'player-status ' + (p2.connected ? 'connected' : '');
                p2Card.className = 'player-card ' + (p2.connected ? '' : 'waiting') + 
                                   (data.currentPlayer === 2 ? ' active' : '');
                
                // Update scores
                document.getElementById('score1').textContent = data.scores[1];
                document.getElementById('score2').textContent = data.scores[2];
                
                // Render board
                this.renderBoard(data.board);
                
                // Update rack
                const myRack = data.players[this.playerNumber]?.rack || [];
                if (JSON.stringify(myRack) !== JSON.stringify(this.rack)) {
                    this.rack = myRack;
                    this.renderRack();
                }
                
                // Update turn indicator
                const isMyTurn = data.currentPlayer === this.playerNumber;
                const bothConnected = p1.connected && p2.connected;
                const turnIndicator = document.getElementById('turnIndicator');
                
                if (!bothConnected) {
                    turnIndicator.textContent = 'Waiting for opponent to join...';
                    turnIndicator.className = 'turn-indicator';
                    this.enableControls(false);
                } else if (isMyTurn) {
                    turnIndicator.textContent = '🎮 Your Turn! Place tiles and click Play Word';
                    turnIndicator.className = 'turn-indicator your-turn';
                    this.enableControls(true);
                    
                    if (this.lastTurn !== this.playerNumber) {
                        this.audio.playTurnChange();
                    }
                } else {
                    const opponentName = this.playerNumber === 1 ? (p2.name || 'Player 2') : (p1.name || 'Player 1');
                    turnIndicator.textContent = `⏳ Waiting for ${opponentName}...`;
                    turnIndicator.className = 'turn-indicator waiting';
                    this.enableControls(false);
                }
                
                this.lastTurn = data.currentPlayer;
                
                // Update log
                if (data.log && data.log.length > 0) {
                    this.renderLog(data.log);
                }
                
                // Check for opponent moves
                if (data.lastMove && 
                    data.lastMove.player !== this.playerNumber && 
                    data.lastMove.timestamp !== this.lastMoveTimestamp) {
                    this.animateOpponentMove(data.lastMove);
                    this.lastMoveTimestamp = data.lastMove.timestamp;
                }
                
                // Game started notification
                if (bothConnected && !data.gameStarted && this.playerNumber === 1) {
                    this.db.ref('rooms/' + this.roomId + '/gameStarted').set(true);
                    this.audio.playGameStart();
                    this.showToast('Game started! Good luck!', 'success');
                }
            }

            renderBoard(boardData) {
                const boardEl = document.getElementById('board');
                
                if (boardEl.children.length === 0) {
                    this.createBoardGrid(boardEl);
                }
                
                for (let row = 0; row < 15; row++) {
                    for (let col = 0; col < 15; col++) {
                        const cell = this.board[row][col].element;
                        const letter = boardData[row][col];
                        
                        if (this.placedTiles.find(pt => pt.row === row && pt.col === col)) {
                            continue;
                        }
                        
                        const existing = cell.querySelector('.tile');
                        if (existing) existing.remove();
                        
                        if (letter !== null) {
                            const tile = this.createTileElement(letter, false);
                            tile.classList.add('placed');
                            cell.appendChild(tile);
                        }
                    }
                }
            }

            createBoardGrid(boardEl) {
                const premiumSquares = {
                    '0,0': 'triple-word', '0,7': 'triple-word', '0,14': 'triple-word',
                    '7,0': 'triple-word', '7,14': 'triple-word',
                    '14,0': 'triple-word', '14,7': 'triple-word', '14,14': 'triple-word',
                    '1,1': 'double-word', '2,2': 'double-word', '3,3': 'double-word',
                    '4,4': 'double-word', '7,7': 'center',
                    '10,10': 'double-word', '11,11': 'double-word', '12,12': 'double-word', '13,13': 'double-word',
                    '1,13': 'double-word', '2,12': 'double-word', '3,11': 'double-word', '4,10': 'double-word',
                    '10,4': 'double-word', '11,3': 'double-word', '12,2': 'double-word', '13,1': 'double-word',
                    '0,3': 'double-letter', '0,11': 'double-letter',
                    '2,6': 'double-letter', '2,8': 'double-letter',
                    '3,0': 'double-letter', '3,7': 'double-letter', '3,14': 'double-letter',
                    '6,2': 'double-letter', '6,6': 'double-letter', '6,8': 'double-letter', '6,12': 'double-letter',
                    '7,3': 'double-letter', '7,11': 'double-letter',
                    '8,2': 'double-letter', '8,6': 'double-letter', '8,8': 'double-letter', '8,12': 'double-letter',
                    '11,0': 'double-letter', '11,7': 'double-letter', '11,14': 'double-letter',
                    '12,6': 'double-letter', '12,8': 'double-letter',
                    '14,3': 'double-letter', '14,11': 'double-letter',
                    '1,5': 'triple-letter', '1,9': 'triple-letter',
                    '5,1': 'triple-letter', '5,5': 'triple-letter', '5,9': 'triple-letter', '5,13': 'triple-letter',
                    '9,1': 'triple-letter', '9,5': 'triple-letter', '9,9': 'triple-letter', '9,13': 'triple-letter',
                    '13,5': 'triple-letter', '13,9': 'triple-letter'
                };

                const labels = {
                    'triple-word': 'TWS', 'double-word': 'DWS',
                    'triple-letter': 'TLS', 'double-letter': 'DLS',
                    'center': '★'
                };

                for (let row = 0; row < 15; row++) {
                    this.board[row] = [];
                    for (let col = 0; col < 15; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        
                        const key = `${row},${col}`;
                        if (premiumSquares[key]) {
                            cell.classList.add(premiumSquares[key]);
                            if (premiumSquares[key] === 'center') {
                                cell.classList.add('star');
                            } else {
                                cell.textContent = labels[premiumSquares[key]];
                            }
                        }
                        
                        cell.addEventListener('dragover', (e) => {
                            e.preventDefault();
                            cell.style.transform = 'scale(1.1)';
                            cell.style.zIndex = '10';
                        });
                        
                        cell.addEventListener('dragleave', () => {
                            cell.style.transform = '';
                            cell.style.zIndex = '';
                        });
                        
                        cell.addEventListener('drop', (e) => {
                            e.preventDefault();
                            cell.style.transform = '';
                            cell.style.zIndex = '';
                            this.handleDrop(row, col);
                        });
                        
                        boardEl.appendChild(cell);
                        this.board[row][col] = { element: cell, tile: null };
                    }
                }
            }

            createTileElement(letter, isDraggable = true, isBlank = false) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.letter = letter;
                tile.dataset.isBlank = isBlank;
                
                const letterEl = document.createElement('span');
                letterEl.className = 'tile-letter';
                letterEl.textContent = letter === ' ' ? '' : letter;
                
                const scoreEl = document.createElement('span');
                scoreEl.className = 'tile-score';
                scoreEl.textContent = letter === ' ' ? '0' : (this.letterScores[letter] || 0);
                
                tile.appendChild(letterEl);
                tile.appendChild(scoreEl);
                
                if (isDraggable) {
                    tile.draggable = true;
                    
                    tile.addEventListener('dragstart', (e) => {
                        if (this.gameState.currentPlayer !== this.playerNumber) {
                            e.preventDefault();
                            return;
                        }
                        this.handleDragStart(e, tile, letter);
                    });
                    
                    tile.addEventListener('dragend', (e) => this.handleDragEnd(e, tile));
                    
                    tile.addEventListener('touchstart', (e) => this.handleTouchStart(e, tile, letter), {passive: false});
                    tile.addEventListener('touchmove', (e) => this.handleTouchMove(e), {passive: false});
                    tile.addEventListener('touchend', (e) => this.handleTouchEnd(e), {passive: false});
                }
                
                return tile;
            }

            renderRack() {
                const rackEl = document.getElementById('rack');
                rackEl.innerHTML = '';
                
                this.rack.forEach((letter, index) => {
                    const tile = this.createTileElement(letter, true);
                    tile.dataset.index = index;
                    tile.dataset.fromRack = 'true';
                    rackEl.appendChild(tile);
                });
            }

            handleDragStart(e, tile, letter) {
                this.audio.playTilePickup();
                tile.classList.add('dragging');
                this.selectedTile = { 
                    tile, 
                    letter, 
                    index: tile.dataset.index,
                    fromRack: tile.dataset.fromRack === 'true'
                };
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', JSON.stringify(this.selectedTile));
            }

            handleDragEnd(e, tile) {
                tile.classList.remove('dragging');
            }

            handleDrop(row, col) {
                if (!this.selectedTile) return;
                if (this.gameState.currentPlayer !== this.playerNumber) return;
                
                if (this.gameState.board[row][col] !== null) return;
                
                if (this.placedTiles.find(pt => pt.row === row && pt.col === col)) return;
                
                const tile = this.createTileElement(this.selectedTile.letter, false);
                tile.classList.add('placed');
                this.board[row][col].element.appendChild(tile);
                
                this.placedTiles.push({
                    row, 
                    col, 
                    letter: this.selectedTile.letter,
                    index: this.selectedTile.index,
                    fromRack: this.selectedTile.fromRack
                });
                
                if (this.selectedTile.fromRack) {
                    this.selectedTile.tile.style.opacity = '0.3';
                    this.selectedTile.tile.draggable = false;
                }
                
                this.audio.playTilePlace();
                this.selectedTile = null;
            }

            handleTouchStart(e, tile, letter) {
                if (this.gameState.currentPlayer !== this.playerNumber) return;
                e.preventDefault();
                
                this.audio.playTilePickup();
                this.isDragging = true;
                this.selectedTile = {
                    tile,
                    letter,
                    index: tile.dataset.index,
                    fromRack: tile.dataset.fromRack === 'true'
                };
                
                const touch = e.touches[0];
                this.dragOffset = {
                    x: touch.clientX - tile.getBoundingClientRect().left,
                    y: touch.clientY - tile.getBoundingClientRect().top
                };
                
                this.dragElement = tile.cloneNode(true);
                this.dragElement.classList.add('dragging');
                this.dragElement.style.position = 'fixed';
                this.dragElement.style.zIndex = '10000';
                this.dragElement.style.pointerEvents = 'none';
                this.dragElement.style.width = tile.offsetWidth + 'px';
                this.dragElement.style.height = tile.offsetHeight + 'px';
                document.body.appendChild(this.dragElement);
                
                this.updateDragPosition(touch.clientX, touch.clientY);
                tile.style.opacity = '0.3';
            }

            handleTouchMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                
                const touch = e.touches[0];
                this.updateDragPosition(touch.clientX, touch.clientY);
                
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.classList.contains('cell')) {
                    element.style.transform = 'scale(1.1)';
                    setTimeout(() => element.style.transform = '', 200);
                }
            }

            handleTouchEnd(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                
                const touch = e.changedTouches[0];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                
                if (element && element.classList.contains('cell')) {
                    const row = parseInt(element.dataset.row);
                    const col = parseInt(element.dataset.col);
                    this.handleDrop(row, col);
                }
                
                if (this.dragElement) {
                    this.dragElement.remove();
                    this.dragElement = null;
                }
                if (this.selectedTile && this.selectedTile.tile) {
                    this.selectedTile.tile.style.opacity = '1';
                }
                
                this.isDragging = false;
                this.selectedTile = null;
            }

            updateDragPosition(x, y) {
                if (this.dragElement) {
                    this.dragElement.style.left = (x - this.dragOffset.x) + 'px';
                    this.dragElement.style.top = (y - this.dragOffset.y) + 'px';
                }
            }

            enableControls(enabled) {
                const buttons = ['playBtn', 'shuffleBtn', 'recallBtn', 'skipBtn'];
                buttons.forEach(id => {
                    document.getElementById(id).disabled = !enabled;
                });
                
                const rackContainer = document.getElementById('rackContainer');
                rackContainer.classList.toggle('disabled', !enabled);
            }

            playWord() {
                if (this.placedTiles.length === 0) {
                    this.showToast('Place tiles on the board first!', 'error');
                    this.audio.playWordInvalid();
                    return;
                }

                const rows = this.placedTiles.map(pt => pt.row);
                const cols = this.placedTiles.map(pt => pt.col);
                const uniqueRows = [...new Set(rows)];
                const uniqueCols = [...new Set(cols)];
                
                const isHorizontal = uniqueRows.length === 1;
                const isVertical = uniqueCols.length === 1;
                
                if (!isHorizontal && !isVertical) {
                    this.showToast('Tiles must be in a straight line!', 'error');
                    this.audio.playWordInvalid();
                    this.vfx.shake(document.getElementById('board'));
                    return;
                }

                const isConnected = this.checkConnectivity();
                if (!isConnected && !this.isFirstMove()) {
                    this.showToast('Word must connect to existing tiles!', 'error');
                    this.audio.playWordInvalid();
                    return;
                }

                let score = 0;
                let wordMultiplier = 1;
                
                this.placedTiles.forEach(pt => {
                    let letterScore = this.letterScores[pt.letter] || 0;
                    const cell = this.board[pt.row][pt.col].element;
                    
                    if (cell.classList.contains('double-letter')) letterScore *= 2;
                    if (cell.classList.contains('triple-letter')) letterScore *= 3;
                    if (cell.classList.contains('double-word')) wordMultiplier *= 2;
                    if (cell.classList.contains('triple-word')) wordMultiplier *= 3;
                    if (cell.classList.contains('center') && this.isFirstMove()) wordMultiplier *= 2;
                    
                    score += letterScore;
                });
                
                score *= wordMultiplier;
                if (this.placedTiles.length === 7) score += 50;

                const newBoard = JSON.parse(JSON.stringify(this.gameState.board));
                this.placedTiles.forEach(pt => {
                    newBoard[pt.row][pt.col] = pt.letter;
                });
                
                const currentRack = [...this.gameState.players[this.playerNumber].rack];
                const usedIndices = this.placedTiles
                    .filter(pt => pt.fromRack)
                    .map(pt => parseInt(pt.index))
                    .sort((a, b) => b - a);
                
                usedIndices.forEach(index => {
                    currentRack.splice(index, 1);
                });
                
                const tilesNeeded = 7 - currentRack.length;
                const newTiles = this.drawTiles(this.gameState.tileBag, tilesNeeded);
                const updatedRack = [...currentRack, ...newTiles];
                
                const playerName = this.gameState.players[this.playerNumber].name || ('Player ' + this.playerNumber);
                
                const updates = {
                    board: newBoard,
                    currentPlayer: this.playerNumber === 1 ? 2 : 1,
                    [`scores/${this.playerNumber}`]: this.gameState.scores[this.playerNumber] + score,
                    [`players/${this.playerNumber}/rack`]: updatedRack,
                    tileBag: this.gameState.tileBag,
                    lastMove: {
                        player: this.playerNumber,
                        tiles: this.placedTiles.map(pt => ({row: pt.row, col: pt.col, letter: pt.letter})),
                        score: score,
                        timestamp: Date.now()
                    },
                    log: [...this.gameState.log, {
                        message: playerName + ' scored ' + score + ' points!',
                        type: 'success',
                        timestamp: Date.now()
                    }]
                };
                
                this.db.ref('rooms/' + this.roomId).update(updates)
                    .then(() => {
                        this.placedTiles = [];
                        this.audio.playWordValid();
                        
                        const cells = this.placedTiles.map(pt => this.board[pt.row][pt.col].element);
                        this.vfx.celebrateWord(cells);
                        this.showToast('Scored ' + score + ' points!', 'success');
                    })
                    .catch(err => {
                        console.error('Update error:', err);
                        this.showToast('Error updating game', 'error');
                    });
            }

            checkConnectivity() {
                for (let pt of this.placedTiles) {
                    const neighbors = [
                        [pt.row - 1, pt.col], [pt.row + 1, pt.col],
                        [pt.row, pt.col - 1], [pt.row, pt.col + 1]
                    ];
                    
                    for (let [r, c] of neighbors) {
                        if (r >= 0 && r < 15 && c >= 0 && c < 15) {
                            if (this.gameState.board[r][c] !== null) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            isFirstMove() {
                for (let row of this.gameState.board) {
                    for (let cell of row) {
                        if (cell !== null) return false;
                    }
                }
                return true;
            }

            shuffleRack() {
                this.audio.playShuffle();
                const rackEl = document.getElementById('rack');
                const tiles = Array.from(rackEl.children);
                
                for (let i = tiles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    rackEl.appendChild(tiles[j]);
                }
                
                rackEl.style.transform = 'translateX(10px)';
                setTimeout(() => rackEl.style.transform = '', 200);
            }

            recallTiles() {
                if (this.placedTiles.length === 0) return;
                
                this.audio.playTilePlace();
                
                this.placedTiles.forEach(pt => {
                    const cell = this.board[pt.row][pt.col].element;
                    const tile = cell.querySelector('.tile');
                    if (tile) tile.remove();
                });
                
                this.placedTiles.filter(pt => pt.fromRack).forEach(pt => {
                    const rackTile = document.querySelector('#rack .tile[data-index="' + pt.index + '"]');
                    if (rackTile) {
                        rackTile.style.opacity = '1';
                        rackTile.draggable = true;
                    }
                });
                
                this.placedTiles = [];
                this.showToast('Tiles recalled', 'info');
            }

            skipTurn() {
                this.audio.playTurnChange();
                
                this.placedTiles.forEach(pt => {
                    const cell = this.board[pt.row][pt.col].element;
                    const tile = cell.querySelector('.tile');
                    if (tile) tile.remove();
                });
                this.placedTiles = [];
                
                const playerName = this.gameState.players[this.playerNumber].name || ('Player ' + this.playerNumber);
                
                const updates = {
                    currentPlayer: this.playerNumber === 1 ? 2 : 1,
                    log: [...this.gameState.log, {
                        message: playerName + ' skipped their turn',
                        type: 'info',
                        timestamp: Date.now()
                    }]
                };
                
                this.db.ref('rooms/' + this.roomId).update(updates);
                this.showToast('Turn skipped', 'info');
            }

            animateOpponentMove(moveData) {
                moveData.tiles.forEach((pt, i) => {
                    setTimeout(() => {
                        const cell = this.board[pt.row][pt.col].element;
                        
                        const existing = cell.querySelector('.tile');
                        if (existing) existing.remove();
                        
                        const tile = this.createTileElement(pt.letter, false);
                        tile.classList.add('placed', 'placed-by-opponent');
                        cell.appendChild(tile);
                        
                        this.audio.playTilePlace();
                    }, i * 150);
                });
                
                setTimeout(() => {
                    this.audio.playWordValid();
                    const cells = moveData.tiles.map(pt => this.board[pt.row][pt.col].element);
                    this.vfx.celebrateWord(cells);
                }, moveData.tiles.length * 150 + 200);
            }

            renderLog(logEntries) {
                const logEl = document.getElementById('gameLog');
                const currentHtml = logEl.innerHTML;
                
                const newEntries = logEntries.slice(-20);
                const newHtml = newEntries.map(entry => 
                    '<div class="log-entry ' + entry.type + '" data-time="' + entry.timestamp + '">' +
                        '[' + new Date(entry.timestamp).toLocaleTimeString() + '] ' + entry.message +
                    '</div>'
                ).join('');
                
                if (currentHtml !== newHtml) {
                    logEl.innerHTML = newHtml;
                    logEl.scrollTop = 0;
                }
            }

            log(message, type) {
                console.log('[' + type + '] ' + message);
            }

            updateConnectionStatus(status, text) {
                const el = document.getElementById('connectionStatus');
                el.className = 'connection-status ' + status;
                el.textContent = text || status;
            }

            hideModal() {
                document.getElementById('connectionModal').classList.add('hidden');
            }

            showToast(message, type) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = 'toast show ' + type;
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            copyRoomCode() {
                const code = document.getElementById('roomCodeDisplay').textContent;
                if (code === '----') return;
                
                navigator.clipboard.writeText(code).then(() => {
                    this.showToast('Room code copied!', 'success');
                }).catch(() => {
                    const input = document.createElement('input');
                    input.value = code;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    this.showToast('Room code copied!', 'success');
                });
            }

            createBackgroundAnimation() {
                const container = document.getElementById('bgAnimation');
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                
                for (let i = 0; i < 15; i++) {
                    const tile = document.createElement('div');
                    tile.className = 'floating-tile';
                    tile.textContent = letters[Math.floor(Math.random() * letters.length)];
                    tile.style.left = Math.random() * 100 + '%';
                    tile.style.top = Math.random() * 100 + '%';
                    tile.style.animationDelay = Math.random() * 20 + 's';
                    tile.style.animationDuration = (15 + Math.random() * 10) + 's';
                    container.appendChild(tile);
                }
            }
        }

        // Initialize game
        const game = new OnlineScrabble();

        // 3D board parallax effect
        document.addEventListener('mousemove', (e) => {
            const board = document.getElementById('boardContainer');
            if (!board || window.innerWidth < 1024) return;
            
            const rect = board.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const rotateY = ((e.clientX - centerX) / window.innerWidth) * 10;
            const rotateX = 20 + ((e.clientY - centerY) / window.innerHeight) * 5;
            
            board.style.transform = 'rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)';
        });
    </script>
</body>
</html>
